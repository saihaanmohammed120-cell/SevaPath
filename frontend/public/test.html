<!DOCTYPE html>
<html>
<head>
<style>
  body { background: #1C1917; color: white; padding: 20px; font-family: sans-serif; display: flex; gap: 20px; }
  .logo-box { width: 200px; height: 200px; border: 1px solid #333; position: relative; }
  svg { width: 100%; height: 100%; }
  .label { position: absolute; bottom: -25px; left: 0; width: 100%; text-align: center; font-size: 12px; }
</style>
</head>
<body>

<div class="logo-box">
  <svg viewBox="0 0 100 100">
    <defs>
      <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
        <stop offset="0%" stopColor="#FDBA74" />
        <stop offset="50%" stopColor="#F97316" />
        <stop offset="100%" stopColor="#9A3412" />
      </linearGradient>
    </defs>
    
    <!-- Model A: Path branches from LEFT pillar -->
    <path d="
      M 50 10
      C 30 20, 15 35, 15 50
      L 15 90
      L 60 90
      C 65 75, 60 65, 50 65
      C 35 65, 30 75, 30 50
      C 30 35, 40 25, 50 25
      C 60 25, 70 35, 70 50
      L 70 90
      L 85 90
      L 85 50
      C 85 35, 70 20, 50 10 Z
    " fill="url(#grad)" />
    <circle cx="50" cy="45" r="8" fill="url(#grad)" />
  </svg>
  <div class="label">Model A</div>
</div>

<div class="logo-box">
  <svg viewBox="0 0 100 100">
    <!-- Model B: Path branches from RIGHT pillar -->
    <path d="
      M 50 10
      C 30 20, 15 35, 15 50
      L 15 90
      L 30 90
      L 30 50
      C 30 35, 40 25, 50 25
      C 60 25, 70 35, 70 50
      C 70 75, 65 65, 50 65
      C 40 65, 35 75, 40 90
      L 85 90
      L 85 50
      C 85 35, 70 20, 50 10 Z
    " fill="url(#grad)" />
    <circle cx="50" cy="45" r="8" fill="url(#grad)" />
  </svg>
  <div class="label">Model B</div>
</div>

<div class="logo-box">
  <svg viewBox="0 0 100 100">
    <!-- Model C: Separate person path in center -->
    <path d="
      M 50 10
      L 20 30 L 20 90 L 35 90 L 35 40 L 50 30 L 65 40 L 65 90 L 80 90 L 80 30 Z
    " fill="url(#grad)" />
    <path d="
      M 35 90 C 45 80, 55 70, 50 60 C 45 50, 65 50, 65 90 Z
    " fill="url(#grad)" />
    <circle cx="50" cy="45" r="8" fill="url(#grad)" />
  </svg>
  <div class="label">Model C</div>
</div>

</body>
</html>
